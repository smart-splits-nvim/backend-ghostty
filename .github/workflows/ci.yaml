name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.version.outputs.current }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: version
        name: Find current version
        run: |
          current="$(git tag --list 'v[0-9]*' --sort=-v:refname \
            | sed -nE '/^v[0-9]+\.[0-9]+\.[0-9]+$/p' \
            | head -n 1)"
          current="${current:-unreleased}"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          {
            echo '## Version'
            echo
            echo "Current release: \`$current\`"
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check formatting
        run: nix develop .#ci --command just fmt-check

      - name: Run Selene
        run: nix develop .#ci --command just lint

      - name: Run LuaLS
        run: nix develop .#ci --command just typecheck

  test:
    name: Test ${{ matrix.os }} / Neovim ${{ matrix.neovim }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        neovim: [v0.11.0, stable, nightly]
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        if: matrix.neovim == 'stable'
        uses: cachix/install-nix-action@v31

      - uses: leafo/gh-actions-lua@v13
        if: matrix.neovim != 'stable'
        with:
          luaVersion: '5.1.5'

      - uses: leafo/gh-actions-luarocks@v6
        if: matrix.neovim != 'stable'

      - name: Install busted
        if: matrix.neovim != 'stable'
        run: |
          luarocks install busted 2.3.0
          luarocks install nlua 0.3.2

      - uses: extractions/setup-just@v4
        if: matrix.neovim != 'stable'

      - uses: rhysd/action-setup-vim@v1
        if: matrix.neovim != 'stable'
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Run tests
        if: matrix.neovim == 'stable'
        run: nix develop .#ci --command just test

      - name: Run tests
        if: matrix.neovim != 'stable'
        run: just test

  release:
    name: Prepare or publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Write release summary
        env:
          CURRENT_VERSION: ${{ needs.version.outputs.current }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_URL: ${{ steps.release.outputs.html_url }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          {
            echo '## Release'
            echo
            if [[ "$RELEASE_CREATED" == 'true' ]]; then
              echo "Published: [\`$TAG_NAME\`]($RELEASE_URL)"
              echo
              echo "Version: \`$RELEASE_VERSION\`"
            else
              echo "Current release: \`$CURRENT_VERSION\`"
              echo
              echo 'No release was published. Release Please will open or update a release PR when commits are releasable.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
